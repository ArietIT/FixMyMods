name: Build desktop applications

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - windows-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install application and build tools
        run: python -m pip install -e ".[dev]"

      - name: Build standalone application
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --windowed
          --onefile
          --name FixMyMods
          --paths src
          tools/launch_gui.py

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: FixMyMods-${{ runner.os }}
          path: dist/FixMyMods*
          if-no-files-found: error
